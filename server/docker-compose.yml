# Goofy Balls - local Nakama + Postgres (Phase 0).
# Usage (from this directory):
#   copy .env.example .env   # first time
#   docker compose up -d
#   .\scripts\smoke.ps1

name: goofyballs

services:
  postgres:
	container_name: goofyballs-postgres
	image: postgres:16.8-alpine
	environment:
	  POSTGRES_DB: ${POSTGRES_DB:-nakama}
	  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
	volumes:
	  - goofyballs_pgdata:/var/lib/postgresql/data
	ports:
	  - "5432:5432"
	healthcheck:
	  test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
	  interval: 3s
	  timeout: 3s
	  retries: 10
	restart: unless-stopped

  nakama:
	container_name: goofyballs-nakama
	image: registry.heroiclabs.com/heroiclabs/nakama:${NAKAMA_VERSION:-3.37.0}
	environment:
	  POSTGRES_DB: ${POSTGRES_DB:-nakama}
	  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
	  NAKAMA_CONSOLE_USERNAME: ${NAKAMA_CONSOLE_USERNAME:-admin}
	  NAKAMA_CONSOLE_PASSWORD: ${NAKAMA_CONSOLE_PASSWORD:?Set NAKAMA_CONSOLE_PASSWORD in server/.env}
	  NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY:?Set NAKAMA_SERVER_KEY in server/.env}
	entrypoint:
	  - /bin/sh
	  - -ecx
	  - >
		/nakama/nakama migrate up
		--database.address "postgres:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}"
		&&
		exec /nakama/nakama
		--config /nakama/data/local.yml
		--database.address "postgres:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}"
		--console.username "$${NAKAMA_CONSOLE_USERNAME}"
		--console.password "$${NAKAMA_CONSOLE_PASSWORD}"
		--socket.server_key "$${NAKAMA_SERVER_KEY}"
	depends_on:
	  postgres:
		condition: service_healthy
	volumes:
	  - ./nakama:/nakama/data
	ports:
	  - "7349:7349"
	  - "7350:7350"
	  - "7351:7351"
	healthcheck:
	  test: ["CMD", "/nakama/nakama", "healthcheck"]
	  interval: 10s
	  timeout: 5s
	  retries: 10
	  start_period: 20s
	restart: unless-stopped

volumes:
  goofyballs_pgdata:
