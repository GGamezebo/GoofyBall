# Goofy Ball — Nakama + Postgres on your own computer (iteration 1, friend rooms).
# Usage (from this folder):
#   copy .env.example .env      (then change the passwords and keys)
#   docker compose up -d
# Only the game API port 7350 is published to the network. Postgres is internal,
# the admin console is reachable from this computer only (127.0.0.1:7351).
# Spaces only in this file (tabs break YAML).

name: goofyball

services:
  postgres:
    container_name: goofyball-postgres
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nakama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
    volumes:
      - nakama_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nakama:
    container_name: goofyball-nakama
    image: registry.heroiclabs.com/heroiclabs/nakama:${NAKAMA_VERSION:-3.37.0}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nakama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
      NAKAMA_CONSOLE_USERNAME: ${NAKAMA_CONSOLE_USERNAME:-admin}
      NAKAMA_CONSOLE_PASSWORD: ${NAKAMA_CONSOLE_PASSWORD:?Set NAKAMA_CONSOLE_PASSWORD in server/.env}
      NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY:-goofyball_dev_key}
      NAKAMA_SESSION_KEY: ${NAKAMA_SESSION_KEY:-goofyball_dev_session_key}
      NAKAMA_REFRESH_KEY: ${NAKAMA_REFRESH_KEY:-goofyball_dev_refresh_key}
      NAKAMA_CONSOLE_SIGNING_KEY: ${NAKAMA_CONSOLE_SIGNING_KEY:-goofyball_dev_console_signing_key}
      NAKAMA_HTTP_KEY: ${NAKAMA_HTTP_KEY:-goofyball_dev_http_key}
    entrypoint:
      - /bin/sh
      - -ecx
      - >
        /nakama/nakama migrate up
        --database.address "postgres:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}"
        &&
        exec /nakama/nakama
        --config /nakama/data/local.yml
        --database.address "postgres:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}"
        --console.username "$${NAKAMA_CONSOLE_USERNAME}"
        --console.password "$${NAKAMA_CONSOLE_PASSWORD}"
        --socket.server_key "$${NAKAMA_SERVER_KEY}"
        --session.encryption_key "$${NAKAMA_SESSION_KEY}"
        --session.refresh_encryption_key "$${NAKAMA_REFRESH_KEY}"
        --console.signing_key "$${NAKAMA_CONSOLE_SIGNING_KEY}"
        --runtime.http_key "$${NAKAMA_HTTP_KEY}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./nakama:/nakama/data
    ports:
      - "7350:7350"
      - "127.0.0.1:7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  nakama_pgdata:
