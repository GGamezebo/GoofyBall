# Nakama config for local/dev (Goofy Balls).
# Secrets overridden from docker-compose env / CLI flags.
# IMPORTANT: spaces only (no tabs).

name: goofyballs
data_dir: "/nakama/data/"

logger:
  level: "DEBUG"
  stdout: true

database:
  address:
    - "postgres:localdb@postgres:5432/nakama"

session:
  token_expiry_sec: 7200
  encryption_key: "goofyballs_dev_session_encryption_key"
  refresh_encryption_key: "goofyballs_dev_refresh_encryption_key"

socket:
  server_key: "defaultkey"
  port: 7350

console:
  port: 7351
  username: "admin"
  password: "password"

runtime:
  path: "/nakama/data/modules"
  http_key: "goofyballs_dev_http_key"
  env:
    - "YANDEX_AUTH_MODE=dev"

social:
  steam:
    app_id: 0
    publisher_key: ""

# google_auth:
#   credentials_json: "{...service account json...}"
