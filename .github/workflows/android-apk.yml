name: Build

on:
  workflow_dispatch:
  push:
    branches: [claude/mobile-game-build-run-le59yg]

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_TEMPLATES_DIR: 4.7.2.stable

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Run headless tests
        run: |
          set +e
          godot --headless --path . --script res://tests/run_all.gd 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if grep -E "^(SCRIPT ERROR|ERROR):|Parse Error" test.log | sort | uniq -c | head -20 | grep .; then
            echo "::error::Engine/GDScript errors found in test log"
            status=1
          fi
          grep -E "^\[(tests|gameplay|FAIL)\]" test.log || true
          exit $status

  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "ndk;28.1.13356709"

      - name: Install Godot and export templates
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q templates.tpz -d tpl && mv tpl/templates ~/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR}

      - name: Configure editor for Android export
        run: |
          # Fixed DEBUG keystore (public on purpose): every CI build is signed the same way,
          # so new APKs install over old ones. Release signing must use real secrets.
          cp ci/debug.keystore "$HOME/debug.keystore"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.7.tres; do
          cat > ~/.config/godot/$f <<CFG
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          CFG
          done
          sed -i 's/^          //' ~/.config/godot/editor_settings-4*.tres

      - name: Import project
        run: godot --headless --import || true

      - name: Export debug APK
        run: |
          mkdir -p bin
          godot --headless --export-debug "Android" "bin/Goofy Balls.apk"
          ls -la bin

      - uses: actions/upload-artifact@v4
        with:
          name: goofy-balls-apk
          path: bin/*.apk
