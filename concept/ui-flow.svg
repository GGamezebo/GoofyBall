ormal' fill='#E8F0FF' text-anchor='start' >2. У всего есть значение по умолчанию — можно не настраивать.</text><text x='90' y='1110' font-family='Arial Rounded MT Bold, Nunito, Arial, sans-serif' font-size='22' font-weight='normal' fill='#E8F0FF' text-anchor='start' >3. Глубина ≤ 2: вкладка → экран. Модалки — для коротких выборов.</text><text x='90' y='1150' font-family='Arial Rounded MT Bold, Nunito, Arial, sans-serif' font-size='22' font-weight='normal' fill='#E8F0FF' text-anchor='start' >4. Главное действие справа снизу, под большой палец; кнопки ≥ 88 px.</text><text x='90' y='1190' font-family='Arial Rounded MT Bold, Nunito, Arial, sans-serif' font-size='22' font-weight='normal' fill='#E8F0FF' text-anchor='start' >5. В матче почти нет UI: счёт, пауза, 2 кнопки. Остальное — в мире.</text><text x='990' y='1030' font-family='Arial Rounded MT Bold, Nunito, Arial, sans-serif' font-size='22' font-weight='normal' fill='#E8F0FF' text-anchor='start' >6. Цвет = смысл: жёлтый — главное, циан — второе, маджента — поделиться.</text><text x='990' y='1070' font-family='Arial Rounded MT Bold, Nunito, Arial, sans-serif' font-size='22' font-weight='normal' fill='#E8F0FF' text-anchor='start' >7. Иконка + 1–2 слова: читается без звука и почти без языка.</text><text x='990' y='1110' font-family='Arial Rounded MT Bold, Nunito, Arial, sans-serif' font-size='22' font-weight='normal' fill='#E8F0FF' text-anchor='start' >8. Один макет для тача, мыши и геймпада (фокус-рамка, хоткеи на PC).</text><text x='990' y='1150' font-family='Arial Rounded MT Bold, Nunito, Arial, sans-serif' font-size='22' font-weight='normal' fill='#E8F0FF' text-anchor='start' >9. Покупки не мешают игре: нет попапов перед матчем, нет рекламы в ранговых.</text><text x='990' y='1190' font-family='Arial Rounded MT Bold, Nunito, Arial, sans-serif' font-size='22' font-weight='normal' fill='#E8F0FF' text-anchor='start' >10. Смешной момент → «★ сохранён» → одна кнопка «Поделиться» в итогах.</text></svg>